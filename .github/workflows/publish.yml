name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Package version that must match package.json (required for manual publish)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  NODE_VERSION_NPM: "22"

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/validation.yml

  version:
    name: version
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assert version (tag or dispatch expected_version)
        run: |
          set -eu
          PKG="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ inputs.expected_version }}"
            test -n "$EXPECTED" || { echo "expected_version required"; exit 1; }
            test "$EXPECTED" = "$PKG" || {
              echo "expected_version=$EXPECTED != package.json version=$PKG"; exit 1;
            }
          else
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$PKG" || {
              echo "tag=$TAG != package.json version=$PKG"; exit 1;
            }
          fi
          echo "version OK: $PKG"

  artifact:
    name: artifact
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Pack and smoke-install tarball
        run: make artifact
      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: gruncellka-porto-sdk-*.tgz

  heavy:
    name: heavy
    needs: [version]
    uses: ./.github/workflows/heavy.yml
    secrets: inherit

  publish:
    name: publish
    needs: [artifact, heavy]
    if: >
      always() &&
      needs.artifact.result == 'success' &&
      needs.heavy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_NPM }}
          registry-url: https://registry.npmjs.org
      - name: Install latest npm (OIDC trusted publishing)
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --access public --provenance ./*.tgz

  release:
    name: release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
